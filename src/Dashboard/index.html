<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ 登录</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;--page:#f7f8f4;--surface:#fff;--text:#252a26;--muted:#606860;--border:#dce2d6;--input:#fff;--input-border:#b9c4b4;--primary:#385d38;--on-primary:#fff;--status:#e0eadb;--on-status:#2d4b2d;--error:#a82424;--focus:#517c48;color:var(--text);background:var(--page)}
@media(prefers-color-scheme:dark){:root{--page:#1b1d1a;--surface:#252823;--text:#e5e8df;--muted:#bec6b7;--border:#454c40;--input:#1b1f19;--input-border:#65705e;--primary:#b1d3a1;--on-primary:#1c3718;--status:#34482d;--on-status:#d3e9c6;--error:#ffb4ab;--focus:#b1d3a1}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:24px}main{max-width:820px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.6;color:var(--muted)}.status{padding:8px 14px;border-radius:24px;background:var(--status);color:var(--on-status);font-size:14px;flex-shrink:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}.card{min-width:0;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:20px}h2{font-size:18px;margin:0 0 16px}button{font:inherit;cursor:pointer;border:0;border-radius:24px;background:var(--primary);color:var(--on-primary);padding:12px 20px}button:hover:not(:disabled){filter:brightness(.92)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:3px}label{display:block;font-size:14px;margin:16px 0 7px}input{font:inherit;width:100%;padding:12px;color:var(--text);background:var(--input);border:1px solid var(--input-border);border-radius:10px}form button{margin-top:20px}#qr{width:220px;max-width:100%;height:auto;aspect-ratio:1;object-fit:contain;display:block;margin:12px auto;background:#fff}#empty{padding:48px 0;text-align:center}#message{min-height:24px;color:var(--error);overflow-wrap:anywhere}#verify{margin-top:20px}#url{overflow-wrap:anywhere;font-size:13px}.hint{font-size:13px}@media(max-width:600px){body{padding:12px}.grid{grid-template-columns:1fr}.card{padding:20px}}
</style></head><body><main>
<div class="top"><div><h1>连接 QQ</h1><p id="account">选择一种方式登录当前适配器实例</p></div><span class="status" id="status" role="status">正在读取状态</span></div>
<section class="card"><h2>恢复上次登录</h2><p class="hint">使用上次扫码保存的会话，无需再次扫码。凭据失效时请重新扫码登录。</p><button id="quick" type="button">快速登录</button></section>
<div class="grid"><section class="card"><h2>扫码登录</h2><div id="empty">点击下方按钮获取二维码</div><img id="qr" alt="QQ 登录二维码" hidden><p class="hint">使用手机 QQ 扫码，并在手机上确认登录。</p><button id="scan" type="button">获取二维码</button></section>
<section class="card"><h2>账号密码登录</h2><form id="login"><label for="uin">QQ 账号</label><input id="uin" inputmode="numeric" pattern="[0-9]+" autocomplete="username" required><label for="password">QQ 密码</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><button type="submit">登录</button></form><p class="hint">密码仅用于本次登录，不写入配置；登录成功后保存会话凭据。</p></section></div>
<p id="message" role="alert"></p>
<section class="card" id="verify" hidden><h2>完成登录验证</h2><p id="url"></p><p class="hint">如需滑块验证，请复制验证地址在浏览器完成，再提交 ticket 和 randstr。</p><form id="captcha" hidden><label for="ticket">ticket</label><input id="ticket" required><label for="randstr">randstr</label><input id="randstr" required><button>提交滑块验证</button></form><form id="sms" hidden><label for="code">短信验证码</label><input id="code" inputmode="numeric" maxlength="16" required><button>提交验证码</button></form></section>
</main><script>
const $=id=>document.getElementById(id);let busy=false,stopped=false,lastImage='';
const labels={ready:'待登录',waiting_scan:'等待扫码',waiting_confirm:'等待手机确认',logging_in:'正在登录',online:'已登录',expired:'二维码已过期',failed:'登录失败',captcha:'需要滑块验证',sms:'需要短信验证',device:'需要设备验证',offline:'已离线'};
function render(s){$('message').textContent=s.error||'';$('status').textContent=labels[s.status]||'待登录';$('account').textContent=s.online?`${s.name||'QQ'} · ${s.uin}`:'选择一种方式登录当前适配器实例';const show=!!s.qr&&!s.online&&s.status!=='expired';$('qr').hidden=!show;$('empty').hidden=show;if(show&&lastImage!==s.qr){lastImage=s.qr;$('qr').src='data:image/png;base64,'+s.qr}$('scan').textContent=s.qr?'刷新二维码':'获取二维码';$('verify').hidden=!['captcha','sms','device'].includes(s.status);$('captcha').hidden=s.status!=='captcha';$('sms').hidden=s.status!=='sms';$('url').textContent=s.verificationUrl||''}
async function call(action,args){if(busy)return;busy=true;$('message').textContent='';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{render(await window.ShiroBotDashboard.call(action,args))}catch(e){$('message').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('quick').onclick=()=>call('quick-login');$('scan').onclick=()=>call('qr-login');$('login').onsubmit=e=>{e.preventDefault();const password=$('password').value;$('password').value='';void call('password-login',{uin:$('uin').value.trim(),password})};$('captcha').onsubmit=e=>{e.preventDefault();void call('captcha',{ticket:$('ticket').value.trim(),randstr:$('randstr').value.trim()})};$('sms').onsubmit=e=>{e.preventDefault();void call('sms',{code:$('code').value.trim()})};
async function poll(){try{await window.ShiroBotDashboard.ready;if(!busy&&!stopped)render(await window.ShiroBotDashboard.call('status'))}catch(e){$('message').textContent=e.message}finally{if(!stopped)setTimeout(poll,2000)}}window.addEventListener('pagehide',()=>stopped=true);void poll();
</script></body></html>
