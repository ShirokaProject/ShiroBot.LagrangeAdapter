name: Deploy Ticket helper

on:
  push:
    branches: [main]
    paths:
      - 'captcha-helper/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ticket-helper-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Ticket helper
        run: node tests/DashboardChecks/ticket-helper.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp captcha-helper/index.html _site/index.html
          touch _site/.nojekyll
          echo ticket-helper.shiroka.org > _site/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment
