# 放在宿主 adapters/lagrange/config.toml；实例 ID 须全局唯一。
[[instances]]
id = "lagrange-qq"
name = "Lagrange QQ"
enabled = false

[instances.config]
# false：启动后通过适配器 Action 扫码；true：自动恢复 keystore / 密码登录 / 扫码。
auto_login = false
uin = ""
password = ""
protocol = "Linux"
# 会话自动保存到本实例 session_store；此路径仅用于旧文件导入和二维码临时目录。
keystore_path = ""
# 留空自动生成 Shiro- 加随机 4–8 位数字，随凭据保存。
device_name = ""
# 登录二维码同时以字符形式输出到宿主控制台。
console_qr_code = true

# PC 自动追加 /api/sign/sec-sign；Android 自动追加 /sign、/energy、/get_tlv553。
# Android 示例：protocol="AndroidPad"，sign_server="https://sign.shiroka.org/android/9.3.80-16750/<Token>"。
# 路径中已有 Token 时 sign_token 留空；或用无 Token 的基础地址和 Bearer sign_token。
sign_server = ""
sign_token = ""
sign_proxy_url = ""
sign_timeout_seconds = 30

# 自定义 AppInfo：推荐复制 appinfo.example.json 后填写文件路径。
# 留空使用所选 protocol 的内置 AppInfo；JSON 可只覆盖需要修改的字段。
# app_info 为内联 JSON 字符串，与 app_info_path 二选一。
app_info_path = ""
app_info = ""
# true 时从 sign_server/appinfo 读取，必须清空上面两个 AppInfo 覆盖字段。
fetch_app_info = false

# 与 Lagrange.Milky 的 Login/Server 配置对应。
auto_re_login = true
auto_reconnect = true
use_ipv6_network = false
get_optimum_server = true
# Trace / Debug / Information / Warning / Error / Critical
log_level = "Information"
# 上传分块固定为 1 MiB。并发数量至少为 1。
highway_concurrent = 4
